[project]
name = "mc-ff-simulator-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "polars==1.17.1",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "scipy==1.14.1",
    "numpy==2.1.3",
    "lxml==5.3.0",
    "html5lib==1.1",
    "beautifulsoup4==4.12.3",
    "nflreadpy==0.1.5",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*", "app/**/__init__.py"]
